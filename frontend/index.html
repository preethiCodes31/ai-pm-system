<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PM System — Project Dashboard</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#111827',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Core React & Babel Development Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        function AIPMSystemDashboard() {
            const [projectId, setProjectId] = React.useState(1);
            const [projectData, setProjectData] = React.useState(null);
            const [resumeFile, setResumeFile] = React.useState(null);
            const [uploadStatus, setUploadStatus] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);
            
            // Project Input Fields
            const [desc, setDesc] = React.useState('Build an online storefront matching local weavers directly to commercial bulk buyers.');
            const [duration, setDuration] = React.useState(3);
            const [teamSize, setTeamSize] = React.useState(3);
            const [tech, setTech] = React.useState('Python, FastAPI, React, SQLite');
            
            const fetchFullPipelineTree = async (targetId) => {
                const idToFetch = targetId || projectId;
                if (!idToFetch) {
                    alert("Please enter or generate a Project ID first.");
                    return;
                }
                setIsLoading(true);
                try {
                    const res = await fetch(`http://localhost:8000/projects/${idToFetch}/orchestrate`, { method: 'POST' });
                    if (res.ok) {
                        const data = await res.json();
                        setProjectData(data);
                    } else {
                        console.error("Failed to fetch pipeline tree.");
                    }
                } catch (err) {
                    console.error("Error connecting to backend API:", err);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleCreateProject = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                const url = `http://localhost:8000/projects/create-project?description=${encodeURIComponent(desc)}&duration_months=${duration}&team_size=${teamSize}&tech_stack=${encodeURIComponent(tech)}`;
                try {
                    const res = await fetch(url, { method: 'POST' });
                    if (res.ok) {
                        const data = await res.json();
                        setProjectId(data.id);
                        await fetchFullPipelineTree(data.id);
                    }
                } catch (err) {
                    console.error("Error creating project:", err);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleResumeUpload = async (e) => {
                e.preventDefault();
                if (!resumeFile) return;
                const formData = new FormData();
                formData.append('file', resumeFile);

                setUploadStatus('Parsing profile vectors with NLP engine...');
                try {
                    const res = await fetch('http://localhost:8000/projects/employees/upload-resume', { method: 'POST', body: formData });
                    if (res.ok) {
                        setUploadStatus('Success! Profile parsed and candidate added to talent pool.');
                        fetchFullPipelineTree();
                    } else {
                        setUploadStatus('Extraction failed. Check file format.');
                    }
                } catch (err) {
                    console.error("Error uploading resume:", err);
                    setUploadStatus('Extraction failed due to network error.');
                }
            };

            const handleAssignmentDecision = async (taskId, statusValue) => {
                try {
                    await fetch(`http://localhost:8000/projects/assignments/${taskId}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: statusValue })
                    });
                    fetchFullPipelineTree();
                } catch (err) {
                    console.error("Error recording assignment decision:", err);
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8">
                    {/* Header Banner */}
                    <header className="mb-10 flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800/80 pb-6">
                        <div>
                            <div className="flex items-center gap-3">
                                <span className="h-3 w-3 rounded-full bg-indigo-500 animate-ping"></span>
                                <h1 className="text-3xl font-extrabold bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400 bg-clip-text text-transparent">
                                    AI Project Management System
                                </h1>
                            </div>
                            
                        </div>
                        <div className="mt-4 md:mt-0 flex items-center gap-2">
                            <span className="px-3 py-1 bg-slate-900 border border-slate-800 rounded-full text-xs font-medium text-slate-300">
                                Llama 3.3 70B Active
                            </span>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Control Column */}
                        <div className="space-y-6">
                            {/* Step 1: Project Form */}
                            <div className="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-6 shadow-2xl">
                                <h2 className="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                                    <span className="flex items-center justify-center w-6 h-6 rounded-full bg-indigo-500/20 text-indigo-400 text-xs font-semibold">1</span>
                                    Project Parameters
                                </h2>
                                
                                <form onSubmit={handleCreateProject} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Project Description Spec</label>
                                        <textarea 
                                            rows="3" 
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
                                            value={desc} 
                                            onChange={e => setDesc(e.target.value)} 
                                        />
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Duration (Months)</label>
                                            <input 
                                                type="number" 
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
                                                value={duration} 
                                                onChange={e => setDuration(e.target.value)} 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Team Size</label>
                                            <input 
                                                type="number" 
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
                                                value={teamSize} 
                                                onChange={e => setTeamSize(e.target.value)} 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Technical Stack</label>
                                        <input 
                                            type="text" 
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
                                            value={tech} 
                                            onChange={e => setTech(e.target.value)} 
                                        />
                                    </div>

                                    <button 
                                        type="submit" 
                                        className="w-full bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-500 hover:to-sky-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 text-sm shadow-lg shadow-indigo-600/20"
                                    >
                                        Generate & Execute Pipeline
                                    </button>
                                </form>

                                <div className="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs text-slate-400">Project ID:</span>
                                        <input 
                                            type="number" 
                                            className="w-16 bg-slate-950 border border-slate-800 rounded-lg p-1 text-center text-xs text-slate-200"
                                            value={projectId || ''} 
                                            onChange={e => setProjectId(parseInt(e.target.value) || '')} 
                                        />
                                    </div>
                                    <button 
                                        type="button" 
                                        onClick={() => fetchFullPipelineTree()} 
                                        className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition"
                                    >
                                        Sync Tree
                                    </button>
                                </div>
                            </div>

                            {/* Step 2: Resume Ingestion */}
                            <div className="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-6 shadow-2xl">
                                <h2 className="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                                    <span className="flex items-center justify-center w-6 h-6 rounded-full bg-sky-500/20 text-sky-400 text-xs font-semibold">2</span>
                                    Parse Candidate Profile
                                </h2>
                                
                                <form onSubmit={handleResumeUpload} className="space-y-4">
                                    <input 
                                        type="file" 
                                        accept=".pdf,.docx" 
                                        onChange={e => setResumeFile(e.target.files[0])}
                                        className="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer" 
                                    />
                                    <button 
                                        type="submit" 
                                        className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-xl transition text-xs border border-slate-700/50"
                                    >
                                        Extract Skills & Ingest Candidate
                                    </button>
                                </form>

                                {uploadStatus && (
                                    <p className="mt-3 text-xs text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 rounded-lg p-2.5">
                                        {uploadStatus}
                                    </p>
                                )}
                            </div>
                        </div>

                        {/* Pipeline Display Area */}
                        <div className="lg:col-span-2">
                            {isLoading ? (
                                <div className="bg-slate-900/50 border border-slate-800 rounded-2xl p-12 text-center flex flex-col items-center justify-center min-h-[400px]">
                                    <div className="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
                                    <p className="text-slate-200 font-medium text-sm">Evaluating architecture with Groq Llama 3.3...</p>
                                    <p className="text-slate-500 text-xs mt-1">Generating milestones, breaking down epics, and matching candidates.</p>
                                </div>
                            ) : projectData ? (
                                <div className="space-y-6">
                                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6">
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                                                Active Plan Tree
                                            </span>
                                            <span className="text-xs text-slate-400">Project ID: #{projectId}</span>
                                        </div>
                                        <h2 className="text-xl font-bold text-white">{projectData.title}</h2>
                                    </div>

                                    {/* Milestone Cards */}
                                    {projectData.milestones?.map((m, mIdx) => (
                                        <div key={m.id} className="bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                                            <div className="flex items-center gap-3 border-b border-slate-800 pb-3">
                                                <span className="px-2.5 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-lg text-xs font-bold">
                                                    M{mIdx + 1}
                                                </span>
                                                <h3 className="text-lg font-bold text-slate-100">📍 {m.title}</h3>
                                            </div>

                                            {/* Epics */}
                                            <div className="space-y-4 pt-1">
                                                {m.epics?.map((e) => (
                                                    <div key={e.id} className="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 space-y-3">
                                                        <h4 className="text-sm font-semibold text-slate-300 flex items-center gap-2">
                                                            <span className="text-sky-400">📦</span> {e.title}
                                                        </h4>

                                                        {/* Tasks */}
                                                        <div className="grid grid-cols-1 gap-2.5">
                                                            {e.tasks?.map((t) => (
                                                                <div key={t.id} className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex flex-col justify-between gap-2">
                                                                    <div>
                                                                        <div className="flex justify-between items-start">
                                                                            <p className="text-xs font-medium text-slate-200">📋 {t.title}</p>
                                                                        </div>
                                                                        {t.description && (
                                                                            <p className="text-[11px] text-slate-400 mt-1">{t.description}</p>
                                                                        )}
                                                                    </div>

                                                                    {/* Assignee Match Badge */}
                                                                    <div className="mt-2 pt-2 border-t border-slate-800/60 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                                                        {t.suggested_assignee ? (
                                                                            <>
                                                                                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs">
                                                                                    <span>👤</span>
                                                                                    <span className="font-semibold">{t.suggested_assignee.name}</span>
                                                                                    <span className="text-[10px] text-emerald-500">
                                                                                        ({(t.suggested_assignee.final_score * 100).toFixed(0)}% Match)
                                                                                    </span>
                                                                                </div>
                                                                                <div className="flex items-center gap-1">
                                                                                    <button 
                                                                                        onClick={() => handleAssignmentDecision(t.id, 'confirmed')}
                                                                                        className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[11px] font-medium transition"
                                                                                    >
                                                                                        Approve
                                                                                    </button>
                                                                                    <button 
                                                                                        onClick={() => handleAssignmentDecision(t.id, 'rejected')}
                                                                                        className="px-2.5 py-1 bg-rose-600/80 hover:bg-rose-500 text-white rounded-lg text-[11px] font-medium transition"
                                                                                    >
                                                                                        Reject
                                                                                    </button>
                                                                                </div>
                                                                            </>
                                                                        ) : (
                                                                            <span className="text-[11px] text-amber-400/90 flex items-center gap-1">
                                                                                ⚠️ No matching resource located inside environment pool.
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="bg-slate-900/40 border border-slate-800 rounded-2xl p-12 text-center text-slate-500 min-h-[300px] flex items-center justify-center">
                                    <p className="text-sm">Submit project parameters to generate a live AI plan tree.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AIPMSystemDashboard />);
    </script>
</body>
</html>
